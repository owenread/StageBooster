<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bubble Notes</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#12131f;
  font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,sans-serif;
  overflow:hidden; height:100vh; width:100vw;
  user-select:none; touch-action:manipulation;
}
canvas#main { position:fixed; inset:0; z-index:1; }

#portal {
  position:fixed; inset:0; z-index:50; pointer-events:none; opacity:0;
}
#portal.zooming {
  animation:portalZoom 0.75s cubic-bezier(0.22,1,0.36,1) forwards;
}
#portal.zooming-out {
  animation:portalZoomOut 0.5s cubic-bezier(0.22,1,0.36,1) forwards;
}
@keyframes portalZoom {
  0%   { opacity:0; backdrop-filter:blur(0px) brightness(1) saturate(1); transform:scale(1); }
  20%  { opacity:1; backdrop-filter:blur(2px) brightness(1.6) saturate(1.4); }
  100% { opacity:0; backdrop-filter:blur(80px) brightness(3) saturate(2); transform:scale(7); }
}
@keyframes portalZoomOut {
  0%   { opacity:0; backdrop-filter:blur(60px); transform:scale(3); }
  40%  { opacity:1; backdrop-filter:blur(4px); transform:scale(1); }
  100% { opacity:0; backdrop-filter:blur(0px); transform:scale(1); }
}

#ui { position:fixed; inset:0; z-index:10; pointer-events:none; }

/* ── Back button — pill style like Apple Settings ── */
#back-btn {
  position:absolute; top:52px; left:20px;
  height:34px; padding:0 14px 0 10px;
  border-radius:100px;
  border:none;
  background:rgba(255,255,255,0.10);
  backdrop-filter:blur(30px) saturate(1.8);
  -webkit-backdrop-filter:blur(30px) saturate(1.8);
  display:flex; align-items:center; gap:4px;
  cursor:pointer; pointer-events:all;
  color:rgba(255,255,255,0.82);
  font-size:15px; font-weight:500;
  letter-spacing:-0.01em;
  opacity:0; transform:translateX(-8px);
  transition:opacity 0.35s cubic-bezier(0.22,1,0.36,1),
             transform 0.35s cubic-bezier(0.22,1,0.36,1),
             background 0.15s;
}
#back-btn::before { content:'‹'; font-size:20px; font-weight:300; line-height:1; margin-top:-1px; }
#back-btn.show { opacity:1; transform:translateX(0); }
#back-btn:hover { background:rgba(255,255,255,0.16); color:#fff; }
#back-btn:active { background:rgba(255,255,255,0.08); transform:scale(0.96); }

/* ── Breadcrumb — centered, SF style ── */
#breadcrumb {
  position:absolute; top:56px; left:50%; transform:translateX(-50%);
  display:flex; align-items:center; gap:6px;
  font-size:13px; font-weight:500;
  color:rgba(255,255,255,0.32); pointer-events:all; white-space:nowrap;
}
#breadcrumb span { cursor:pointer; transition:color 0.2s; padding:3px 0; }
#breadcrumb span:hover { color:rgba(255,255,255,0.7); }
#breadcrumb span.active { color:rgba(255,255,255,0.88); font-weight:600; }
#breadcrumb .sep { color:rgba(255,255,255,0.14); pointer-events:none; font-size:11px; }

/* ── Hint pill at bottom ── */
#hint {
  position:absolute; bottom:40px; left:50%; transform:translateX(-50%);
  font-size:12px; font-weight:500; letter-spacing:0.01em;
  color:rgba(255,255,255,0.28);
  background:rgba(255,255,255,0.07);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.09);
  padding:7px 16px; border-radius:100px;
  white-space:nowrap; transition:opacity 0.4s;
}

/* ── PERSON DETAIL PANEL ── */
#person-panel {
  position:fixed; inset:0; z-index:60;
  display:flex; align-items:flex-end; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity 0.4s;
}
#person-panel.open { opacity:1; pointer-events:all; }
#person-scrim {
  position:absolute; inset:0;
  background:rgba(8,8,18,0.6);
  backdrop-filter:blur(28px) saturate(1.5);
  -webkit-backdrop-filter:blur(28px) saturate(1.5);
  cursor:pointer;
}
#person-sheet {
  position:relative; z-index:1;
  width:min(600px,100vw); height:78vh;
  background:rgba(18,18,28,0.97);
  border:1px solid rgba(255,255,255,0.09); border-bottom:none;
  border-radius:22px 22px 0 0;
  backdrop-filter:blur(60px); -webkit-backdrop-filter:blur(60px);
  overflow:hidden;
  transform:translateY(110%); transition:transform 0.55s cubic-bezier(0.22,1,0.36,1);
  box-shadow:0 -1px 0 rgba(255,255,255,0.06), 0 -20px 80px rgba(0,0,0,0.5);
  display:flex; flex-direction:column;
}
#person-panel.open #person-sheet { transform:translateY(0); }

#person-header {
  padding:16px 20px 14px;
  border-bottom:1px solid rgba(255,255,255,0.06);
  flex-shrink:0; display:flex; align-items:center; gap:12px;
}
#person-handle {
  width:32px; height:4px; border-radius:2px;
  background:rgba(255,255,255,0.12); margin:0 auto 14px;
}
.person-avatar-sm {
  width:40px; height:40px; border-radius:50%;
  border:1.5px solid rgba(255,255,255,0.15);
  display:flex; align-items:center; justify-content:center;
  font-size:16px; font-weight:700; color:rgba(255,255,255,0.9);
  flex-shrink:0;
}
#person-info { flex:1; }
#person-name-sm { font-size:16px; font-weight:650; letter-spacing:-0.01em; color:rgba(255,255,255,0.92); }
#person-role-sm { font-size:11px; font-weight:500; letter-spacing:0.02em; color:rgba(255,255,255,0.3); margin-top:2px; }
.live-pill {
  display:flex; align-items:center; gap:5px;
  padding:5px 12px; border-radius:100px;
  background:rgba(34,197,94,0.1); border:1px solid rgba(34,197,94,0.25);
  font-size:11px; font-weight:600; letter-spacing:0.05em; text-transform:uppercase;
  color:#22c55e;
}
.live-dot { width:5px; height:5px; border-radius:50%; background:#22c55e; animation:livePulse 1.4s ease-in-out infinite; }
@keyframes livePulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.35;transform:scale(0.65)} }

#stream-container {
  flex:1; position:relative; overflow:hidden;
}
#stream-canvas-el {
  position:absolute; inset:0; width:100%; height:100%;
}

#notes-section {
  flex-shrink:0; max-height:220px; overflow-y:auto;
  padding:16px 24px 32px;
  border-top:1px solid rgba(255,255,255,0.07);
}
#notes-section-title {
  font-size:10px; letter-spacing:0.12em; text-transform:uppercase;
  color:rgba(255,255,255,0.22); margin-bottom:12px;
}
.note-item { padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.05); }
.note-item:last-child { border-bottom:none; }
.note-time { font-size:10px; letter-spacing:0.07em; text-transform:uppercase; color:rgba(255,255,255,0.18); margin-bottom:6px; }
.note-text { font-size:14px; line-height:1.6; color:rgba(255,255,255,0.6); }
</style>
</head>
<body>
<canvas id="main"></canvas>
<div id="portal"></div>

<div id="ui">
  <div id="back-btn" onclick="goBack()">Back</div>
  <div id="breadcrumb"></div>
  <div id="hint"></div>
</div>

<!-- Person detail panel with live stream -->
<div id="person-panel">
  <div id="person-scrim" onclick="closePanel()"></div>
  <div id="person-sheet">
    <div id="person-header">
      <div class="person-avatar-sm" id="panel-avatar"></div>
      <div id="person-info">
        <div id="person-name-sm"></div>
        <div id="person-role-sm"></div>
      </div>
      <div class="live-pill"><div class="live-dot"></div>Live</div>
    </div>
    <div id="stream-container">
      <canvas id="stream-canvas-el"></canvas>
    </div>
    <div id="notes-section">
      <div id="notes-section-title">Recent Notes</div>
      <div id="notes-list"></div>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════
// DATA
// ════════════════════════════════════════
const DATA = {
  projects:[
    { id:'p1', name:'Brand Refresh', sub:'3 teams', teams:[
      { id:'t1', name:'Design', sub:'4 people', people:[
        {id:'u1',name:'Maya',role:'Lead Designer',stream:'figma',
         notes:[{time:'Today 11:42am',text:'Finalized the color system. Cooler neutral base — ditching the warm grays.'},{time:'Yesterday',text:'Logo lockup sent to Marcus. He liked v3 on dark.'}]},
        {id:'u2',name:'Jordan',role:'Motion',stream:'code',
         notes:[{time:'Today 9:15am',text:'Transition system at 400ms feels right.'},{time:'Mon',text:'Reference from Vercel and Linear for micro-interactions.'}]},
        {id:'u3',name:'Sam',role:'Typography',stream:'browser',
         notes:[{time:'Today',text:'Switching to Instrument Serif — weight without feeling corporate.'}]},

         notes:[{time:'Yesterday',text:'Icon set 80% done. Feedback on outline weight at small sizes.'}]},
      ]},
      { id:'t2', name:'Strategy', sub:'3 people', people:[
        {id:'u5',name:'Marcus',role:'Brand Strategist',stream:'slides',
         notes:[{time:'Today 2pm',text:'Positioning locked. "Precision without pretense" as voice anchor.'}]},
        {id:'u6',name:'Priya',role:'Research',stream:'data',

        {id:'u7',name:'Owen',role:'Copywriter',stream:'notion',
         notes:[{time:'Today',text:'"Built to disappear" — controversial tagline but it\'s right.'}]},
      ]},
      { id:'t3', name:'Engineering', sub:'3 people', people:[
        {id:'u8',name:'Nadia',role:'Frontend Lead',stream:'code',
         notes:[{time:'Today 3pm',text:'Design tokens exported — integration starts tomorrow.'},{time:'Mon',text:'CSS custom properties over JS theme. Cleaner.'}]},
        {id:'u9',name:'Leo',role:'Dev',stream:'terminal',
         notes:[{time:'Yesterday',text:'Animation pass done. Cut 8 reflows. Butter smooth on mobile.'}]},
        {id:'u10',name:'Cass',role:'Dev',stream:'browser',
         notes:[{time:'Today',text:'A11y audit — fixing contrast and keyboard nav on modal.'}]},
      ]},
    ]},
    { id:'p2', name:'Product Launch', sub:'2 teams', teams:[
      { id:'t4', name:'Marketing', sub:'3 people', people:[
        {id:'u11',name:'Zoe',role:'Campaign Lead',stream:'slides',
         notes:[{time:'Today',text:'Three-phase: tease, announce, sustain. Tease in 10 days.'}]},
        {id:'u12',name:'Kai',role:'Paid Media',stream:'data',
         notes:[{time:'Today 11am',text:'Video 3x CTR vs static. Meta and TikTok handed off.'}]},
        {id:'u13',name:'Aria',role:'Content',stream:'notion',
         notes:[{time:'Yesterday',text:'Blog posts scheduled. SEO flagged 2 missing links.'}]},
      ]},
      { id:'t5', name:'Operations', sub:'2 people', people:[
        {id:'u14',name:'Dev',role:'Ops Lead',stream:'data',
         notes:[{time:'Today',text:'47 checklist items. 34 done. On track for Thursday.'}]},
        {id:'u15',name:'Mira',role:'Support Lead',stream:'browser',
         notes:[{time:'Today 9am',text:'Scripts written. Team trained on top 10 questions.'}]},
      ]},
    ]},
    { id:'p3', name:'Research Hub', sub:'2 teams', teams:[
      { id:'t6', name:'User Research', sub:'3 people', people:[
        {id:'u16',name:'Finn',role:'UX Researcher',stream:'figma',
         notes:[{time:'Today',text:'Drop-off at step 3 onboarding — too much asked upfront.'}]},
        {id:'u17',name:'Lena',role:'Data Analyst',stream:'data',
         notes:[{time:'Today 1pm',text:'Week-2 retention drops 40% without trigger email.'}]},
        {id:'u18',name:'Theo',role:'Researcher',stream:'notion',
         notes:[{time:'Yesterday',text:'Users want confidence, not features.'}]},
      ]},
      { id:'t7', name:'Data Science', sub:'2 people', people:[
        {id:'u19',name:'Ines',role:'ML Engineer',stream:'terminal',
         notes:[{time:'Today',text:'Model v2 hits 94.2% on validation. Staging tomorrow.'}]},
        {id:'u20',name:'Ryo',role:'Data Engineer',stream:'code',
         notes:[{time:'Today 10:30am',text:'ETL in 8 mins vs 34 mins. Pipeline refactor done.'}]},
      ]},
    ]},
  ]
};

const COLORS=[
  [180,200,255],[210,185,255],[255,205,180],[170,240,200],
  [255,185,205],[195,238,255],[255,230,175],[185,255,215],
];

// ════════════════════════════════════════
// CANVAS SETUP
// ════════════════════════════════════════
const canvas=document.getElementById('main');
const ctx=canvas.getContext('2d');
let W,H,dpr;
function resize(){
  dpr=window.devicePixelRatio||1;
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.scale(dpr,dpr);
}
resize();
window.addEventListener('resize',()=>{ resize(); rebuildScene(); });

let T=0, level=0, currentProject=null, currentTeam=null;
let bubbles=[], stars=[], bgBlobs=[], transitioning=false;
let mouseX=-999, mouseY=-999;

// ════════════════════════════════════════
// STREAM RENDERERS
// ════════════════════════════════════════
const STREAMS = {
  code:(c,x,y,w,h,t)=>{
    c.fillStyle='#0d1117'; c.fillRect(x,y,w,h);
    c.fillStyle='#161b22'; c.fillRect(x,y,w*0.1,h);
    const lines=[
      {col:'#ff7b72',txt:'const handleZoom = async (e) => {'},
      {col:'#8b949e',txt:'  // Spring animation into level'},
      {col:'#79c0ff',txt:'  await portal.animate({'},
      {col:'#a5d6ff',txt:"    scale: 8, blur: '60px',"},
      {col:'#ffa657',txt:"    duration: 680,"},
      {col:'#a5d6ff',txt:"    easing: 'cubic-bezier(0.22,1,0.36,1)'"},
      {col:'#c9d1d9',txt:'  });'},
      {col:'#ff7b72',txt:'  const next = await loadLevel('},
      {col:'#79c0ff',txt:'    current.level + 1'},
      {col:'#c9d1d9',txt:'  );'},
      {col:'#50fa7b',txt:'  renderBubbles(next.data);'},
      {col:'#c9d1d9',txt:'}'},
      {col:'#8b949e',txt:''},
      {col:'#ff7b72',txt:'function blobPoints(cx, cy, r) {'},
      {col:'#c9d1d9',txt:'  return harmonics.map((h,i) => {'},
      {col:'#a5d6ff',txt:'    const warp = h.amp *'},
      {col:'#a5d6ff',txt:'      Math.sin(h.freq*angle + T);'},
    ];
    const lh=h*0.054; const cursor=Math.floor(t*0.025)%lines.length;
    lines.forEach((l,i)=>{
      const ly=y+h*0.04+i*lh;
      c.font=`${Math.max(9,lh*0.7)}px monospace`;
      c.fillStyle='#30363d'; c.textAlign='right';
      c.fillText(i+1, x+w*0.08, ly+lh*0.75);
      c.textAlign='left'; c.fillStyle=l.col;
      const maxChars=Math.floor(w*0.055);
      c.fillText(l.txt.slice(0,maxChars), x+w*0.12, ly+lh*0.75);
      if(i===cursor && Math.floor(t*0.06)%2===0){
        const tw=c.measureText(l.txt.slice(0,Math.min(maxChars,Math.floor((t*0.04)%Math.max(1,l.txt.length+1))))).width;
        c.fillStyle='rgba(80,250,123,0.9)';
        c.fillRect(x+w*0.12+tw, ly+lh*0.08, 2, lh*0.82);
      }
    });
    const sp=(Math.sin(t*0.006)+1)/2;
    c.fillStyle='#21262d'; c.fillRect(x+w-5,y,5,h);
    c.fillStyle='#30363d'; c.fillRect(x+w-4, y+h*sp*0.75, 3, h*0.18);
  },

  terminal:(c,x,y,w,h,t)=>{
    c.fillStyle='#0a0e14'; c.fillRect(x,y,w,h);
    c.fillStyle='#1c2030'; c.fillRect(x,y,w,h*0.08);
    c.fillStyle='#ff5f57'; c.beginPath(); c.arc(x+w*0.055,y+h*0.04,h*0.018,0,Math.PI*2); c.fill();
    c.fillStyle='#febc2e'; c.beginPath(); c.arc(x+w*0.105,y+h*0.04,h*0.018,0,Math.PI*2); c.fill();
    c.fillStyle='#28c840'; c.beginPath(); c.arc(x+w*0.155,y+h*0.04,h*0.018,0,Math.PI*2); c.fill();
    c.font=`${h*0.032}px monospace`; c.fillStyle='#8b949e'; c.textAlign='center';
    c.fillText('zsh — 120×38', x+w*0.5, y+h*0.052);
    const cmds=[
      {p:'➜ ',pc:'#50fa7b',cmd:'~ git status',cc:'#f8f8f2'},
      {p:'',pc:'#8b949e',cmd:'On branch main — nothing to commit',cc:'#8b949e'},
      {p:'➜ ',pc:'#50fa7b',cmd:'~ npm run dev',cc:'#f8f8f2'},
      {p:'>',pc:'#8b949e',cmd:' Starting dev server...',cc:'#6272a4'},
      {p:'',pc:'#50fa7b',cmd:'✓  Ready on http://localhost:3000',cc:'#50fa7b'},
      {p:'',pc:'#ffb86c',cmd:'  HMR connected • watching 84 files',cc:'#ffb86c'},
      {p:'➜ ',pc:'#50fa7b',cmd:'~ git add -A && git commit -m',cc:'#f8f8f2'},
      {p:'',pc:'#a5d6ff',cmd:'"feat: liquid glass bubble morphing"',cc:'#a5d6ff'},
      {p:'',pc:'#50fa7b',cmd:'[main 3f8a21d] feat: liquid glass',cc:'#50fa7b'},
      {p:'',pc:'#8b949e',cmd:' 4 files changed, 312 insertions',cc:'#8b949e'},
      {p:'➜ ',pc:'#50fa7b',cmd:'~ git push origin main',cc:'#f8f8f2'},
      {p:'',pc:'#ffb86c',cmd:'  Enumerating objects: 14 done.',cc:'#ffb86c'},
      {p:'',pc:'#50fa7b',cmd:'✓  Branch main is up to date',cc:'#50fa7b'},
      {p:'➜ ',pc:'#50fa7b',cmd:'~ ',cc:'#f8f8f2'},
    ];
    const lh=h*0.057; const show=Math.min(cmds.length,Math.floor(t*0.008)+1);
    c.textAlign='left';
    cmds.slice(0,show).forEach((cmd,i)=>{
      const ly=y+h*0.1+i*lh;
      c.font=`bold ${Math.max(9,lh*0.72)}px monospace`;
      c.fillStyle=cmd.pc; c.fillText(cmd.p,x+w*0.04,ly+lh*0.78);
      c.fillStyle=cmd.cc; c.font=`${Math.max(9,lh*0.7)}px monospace`;
      const typed=i===show-1?cmd.cmd.slice(0,Math.floor((t*0.018)%Math.max(1,cmd.cmd.length+1))):cmd.cmd;
      c.fillText(typed,x+w*0.04+c.measureText(cmd.p).width,ly+lh*0.78);
    });
    if(Math.floor(t*0.06)%2===0){
      const i=show-1; const cmd=cmds[i];
      const ly=y+h*0.1+i*lh;
      const typed=cmd.cmd.slice(0,Math.floor((t*0.018)%Math.max(1,cmd.cmd.length+1)));
      c.font=`${Math.max(9,lh*0.7)}px monospace`;
      const tw=c.measureText(cmd.p+typed).width;
      c.fillStyle='rgba(248,248,242,0.85)';
      c.fillRect(x+w*0.04+tw,ly+lh*0.1,2,lh*0.75);
    }
  },

  figma:(c,x,y,w,h,t)=>{
    c.fillStyle='#1e1e1e'; c.fillRect(x,y,w,h);
    // toolbar top
    c.fillStyle='#2c2c2c'; c.fillRect(x,y,w,h*0.07);
    c.fillStyle='#18a0fb'; c.font=`bold ${h*0.038}px -apple-system,sans-serif`; c.textAlign='center';
    c.fillText('Figma',x+w*0.5,y+h*0.047);
    // left panel
    c.fillStyle='#252525'; c.fillRect(x,y+h*0.07,w*0.2,h*0.93);
    const layers=['⬡ Frame','  ↳ Nav','  ↳ Hero','  ↳ Cards','  ↳ Footer','○ Button','  ↳ Label'];
    const selL=Math.floor(t*0.012)%layers.length;
    c.textAlign='left';
    layers.forEach((l,i)=>{
      if(i===selL){ c.fillStyle='rgba(24,160,251,0.22)'; c.fillRect(x,y+h*0.07+i*h*0.075,w*0.2,h*0.075); }
      c.font=`${h*0.04}px -apple-system,sans-serif`;
      c.fillStyle=i===selL?'#18a0fb':'#777';
      c.fillText(l,x+w*0.025,y+h*0.112+i*h*0.075);
    });
    // right panel
    c.fillStyle='#252525'; c.fillRect(x+w*0.78,y+h*0.07,w*0.22,h*0.93);
    const props=['Width','Height','X','Y','Radius','Opacity'];
    const vals=['360','64','0','80','12','100%'];
    props.forEach((p,i)=>{
      c.font=`${h*0.036}px -apple-system,sans-serif`;
      c.fillStyle='#666'; c.textAlign='left'; c.fillText(p,x+w*0.8,y+h*0.12+i*h*0.08);
      c.fillStyle='#ccc'; c.textAlign='right'; c.fillText(vals[i],x+w*0.99,y+h*0.12+i*h*0.08);
    });
    // canvas
    c.fillStyle='#383838'; c.fillRect(x+w*0.2,y+h*0.07,w*0.58,h*0.93);
    const frame={x:x+w*0.24,y:y+h*0.1,w:w*0.5,h:h*0.86};
    c.fillStyle='#fff'; c.fillRect(frame.x,frame.y,frame.w,frame.h);
    // nav bar
    const hue=210+15*Math.sin(t*0.008);
    c.fillStyle=`hsl(${hue},85%,54%)`; c.fillRect(frame.x,frame.y,frame.w,frame.h*0.09);
    c.fillStyle='rgba(255,255,255,0.95)'; c.font=`bold ${frame.h*0.042}px -apple-system,sans-serif`;
    c.textAlign='left'; c.fillText('BubbleNotes',frame.x+frame.w*0.04,frame.y+frame.h*0.065);
    // hero

// CRYSTAL GLASS BUBBLE RENDERER
// ════════════════════════════════════════
function blobPoints(cx,cy,r,harmonics,t,nPts=90){
  const pts=[];
  for(let i=0;i<nPts;i++){
    const angle=(i/nPts)*Math.PI*2;
    let warp=0;
    for(const h of harmonics) warp+=h.amp*Math.sin(h.freq*angle+h.phase+t*h.speed);
    pts.push({x:cx+Math.cos(angle)*(r+warp), y:cy+Math.sin(angle)*(r+warp)});
  }
  return pts;
}
function drawBlobPath(pts){
  if(pts.length<3) return;
  const n=pts.length;
  ctx.beginPath();
  ctx.moveTo((pts[0].x+pts[1].x)/2,(pts[0].y+pts[1].y)/2);
  for(let i=0;i<n;i++){
    const p0=pts[i], p1=pts[(i+1)%n];
    ctx.quadraticCurveTo(p0.x,p0.y,(p0.x+p1.x)/2,(p0.y+p1.y)/2);
  }
  ctx.closePath();
}
function pointInBlob(px,py,pts){
  let inside=false; const n=pts.length;
  for(let i=0,j=n-1;i<n;j=i++){
    const xi=pts[i].x,yi=pts[i].y,xj=pts[j].x,yj=pts[j].y;
    if(((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}

function drawCrystalBubble(cx, cy, r, color, t, hover, isPerson, streamCanvas) {
  const [cr,cg,cb]=color;
  const hoverScale = 1 + hover*0.055;
  const R = r * hoverScale;

  ctx.save();

  // ── 1. Outer diffuse glow ──
  const glow=ctx.createRadialGradient(cx,cy,R*0.5,cx,cy,R*2.2);
  glow.addColorStop(0,`rgba(${cr},${cg},${cb},${0.05+hover*0.06})`);
  glow.addColorStop(1,`rgba(${cr},${cg},${cb},0)`);
  ctx.beginPath(); ctx.arc(cx,cy,R*2.2,0,Math.PI*2);
  ctx.fillStyle=glow; ctx.fill();

  // ── 2. Clip to sphere ──
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.clip();

  // ── 3. Stream content inside ──
  if(isPerson && streamCanvas){
    ctx.save();
    // slightly darken for glass over-content
    ctx.drawImage(streamCanvas, cx-R, cy-R, R*2, R*2);
    ctx.restore();
  } else {
    // base crystal tint — very transparent
    const base=ctx.createRadialGradient(cx-R*0.15,cy-R*0.2,0,cx,cy,R);
    base.addColorStop(0,`rgba(${cr},${cg},${cb},0.22)`);
    base.addColorStop(0.6,`rgba(${cr},${cg},${cb},0.06)`);
    base.addColorStop(1,`rgba(${cr},${cg},${cb},0.18)`);
    ctx.fillStyle=base; ctx.fillRect(cx-R,cy-R,R*2,R*2);
  }

  // ── 4. Glass dark vignette over content ──
  const vig=ctx.createRadialGradient(cx,cy,R*0.2,cx,cy,R);
  vig.addColorStop(0,'rgba(0,0,0,0)');
  vig.addColorStop(0.65,'rgba(0,0,0,0.04)');
  vig.addColorStop(1,'rgba(0,0,0,0.42)');
  ctx.fillStyle=vig; ctx.fillRect(cx-R,cy-R,R*2,R*2);

  // ── 5. Prismatic rainbow edge refraction ──
  // Rainbow band along the bottom-left edge — matches reference
  const rainbowAngles=[
    {a:0.55*Math.PI, color:'rgba(255,100,100,0.28)'},
    {a:0.6*Math.PI,  color:'rgba(255,180,80,0.22)'},
    {a:0.65*Math.PI, color:'rgba(255,255,100,0.18)'},
    {a:0.7*Math.PI,  color:'rgba(100,255,130,0.18)'},
    {a:0.75*Math.PI, color:'rgba(80,180,255,0.22)'},
    {a:0.8*Math.PI,  color:'rgba(160,80,255,0.25)'},
  ];
  rainbowAngles.forEach(({a,color:rc})=>{
    const rx=cx+Math.cos(a)*R*0.78, ry=cy+Math.sin(a)*R*0.78;
    const rg=ctx.createRadialGradient(rx,ry,0,rx,ry,R*0.38);
    rg.addColorStop(0,rc); rg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=rg; ctx.fillRect(cx-R,cy-R,R*2,R*2);
  });

  // Second rainbow band — top right
  const rainbowAngles2=[
    {a:-0.15*Math.PI, color:'rgba(255,120,120,0.15)'},
    {a:-0.1*Math.PI,  color:'rgba(255,200,100,0.12)'},
    {a:-0.05*Math.PI, color:'rgba(120,255,160,0.12)'},
    {a:0.0*Math.PI,   color:'rgba(100,200,255,0.15)'},
  ];
  rainbowAngles2.forEach(({a,color:rc})=>{
    const rx=cx+Math.cos(a)*R*0.82, ry=cy+Math.sin(a)*R*0.82;
    const rg=ctx.createRadialGradient(rx,ry,0,rx,ry,R*0.28);
    rg.addColorStop(0,rc); rg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=rg; ctx.fillRect(cx-R,cy-R,R*2,R*2);
  });

  // ── 6. Large soft primary specular (top-left arc) ──
  ctx.save();
  ctx.translate(cx-R*0.18, cy-R*0.26);
  ctx.rotate(-0.38);
  ctx.scale(1, 0.48);
  const spec1=ctx.createRadialGradient(0,0,0,0,0,R*0.55);
  spec1.addColorStop(0,'rgba(255,255,255,0.72)');
  spec1.addColorStop(0.35,'rgba(255,255,255,0.22)');
  spec1.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath(); ctx.arc(0,0,R*0.55,0,Math.PI*2);
  ctx.fillStyle=spec1; ctx.fill();
  ctx.restore();

  // ── 7. Secondary specular arc (middle-right) — matches ref photo ──
  ctx.save();
  ctx.translate(cx+R*0.3, cy+R*0.05);
  ctx.rotate(0.5);
  ctx.scale(0.4, 1);
  const spec2=ctx.createRadialGradient(0,0,0,0,0,R*0.45);
  spec2.addColorStop(0,'rgba(255,255,255,0.38)');
  spec2.addColorStop(0.5,'rgba(255,255,255,0.08)');
  spec2.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath(); ctx.arc(0,0,R*0.45,0,Math.PI*2);
  ctx.fillStyle=spec2; ctx.fill();
  ctx.restore();

  // ── 8. Bright sharp pinpoint highlight ──
  const dot1=ctx.createRadialGradient(cx-R*0.33,cy-R*0.40,0,cx-R*0.33,cy-R*0.40,R*0.11);
  dot1.addColorStop(0,'rgba(255,255,255,1)');
  dot1.addColorStop(0.4,'rgba(255,255,255,0.6)');
  dot1.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath(); ctx.arc(cx-R*0.33,cy-R*0.40,R*0.11,0,Math.PI*2);
  ctx.fillStyle=dot1; ctx.fill();

  // ── 9. Secondary tiny highlight dot ──
  const dot2=ctx.createRadialGradient(cx+R*0.18,cy-R*0.52,0,cx+R*0.18,cy-R*0.52,R*0.055);
  dot2.addColorStop(0,'rgba(255,255,255,0.9)');
  dot2.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath(); ctx.arc(cx+R*0.18,cy-R*0.52,R*0.055,0,Math.PI*2);
  ctx.fillStyle=dot2; ctx.fill();

  // ── 10. Animated shimmer ──
  const shimmerT=t*0.016;
  const sx=cx+Math.cos(shimmerT)*R*0.22;
  const sy=cy+Math.sin(shimmerT*0.65)*R*0.14-R*0.1;
  const shimG=ctx.createRadialGradient(sx,sy,0,sx,sy,R*0.18);
  shimG.addColorStop(0,`rgba(255,255,255,${0.28+0.18*Math.sin(shimmerT)})`);
  shimG.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath(); ctx.arc(sx,sy,R*0.18,0,Math.PI*2);
  ctx.fillStyle=shimG; ctx.fill();

  // ── 11. Bottom color caustic bloom ──
  const bloom=ctx.createRadialGradient(cx+R*0.08,cy+R*0.55,0,cx+R*0.05,cy+R*0.5,R*0.5);
  bloom.addColorStop(0,`rgba(${cr},${cg},${cb},0.45)`);
  bloom.addColorStop(1,`rgba(${cr},${cg},${cb},0)`);
  ctx.beginPath(); ctx.ellipse(cx+R*0.05,cy+R*0.5,R*0.42,R*0.28,0.3,0,Math.PI*2);
  ctx.fillStyle=bloom; ctx.fill();

  ctx.restore(); // unclip sphere

  // ── 12. Crystal rim — multiple strokes like the reference ──
  // Outer rim
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.strokeStyle=`rgba(255,255,255,${0.32+hover*0.2})`;
  ctx.lineWidth=1.5; ctx.stroke();

  // Inner rim 1
  ctx.beginPath(); ctx.arc(cx,cy,R*0.91,0,Math.PI*2);
  ctx.strokeStyle='rgba(255,255,255,0.08)';
  ctx.lineWidth=1; ctx.stroke();

  // Inner rim 2 — prismatic
  ctx.beginPath(); ctx.arc(cx,cy,R*0.96,0,Math.PI*2);
  ctx.strokeStyle=`rgba(${cr+30},${cg+20},${cb+40},0.12)`;
  ctx.lineWidth=0.8; ctx.stroke();

  // Hover glow ring
  if(hover>0.02){
    ctx.beginPath(); ctx.arc(cx,cy,R+8,0,Math.PI*2);
    ctx.strokeStyle=`rgba(${cr},${cg},${cb},${hover*0.5})`;
    ctx.lineWidth=2.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx,cy,R+16,0,Math.PI*2);
    ctx.strokeStyle=`rgba(${cr},${cg},${cb},${hover*0.15})`;
    ctx.lineWidth=3; ctx.stroke();
  }

  // ── 13. LIVE indicator for person bubbles ──
  if(isPerson){
    ctx.fillStyle=`rgba(34,197,94,${0.8+0.2*Math.sin(t*0.08)})`;
    ctx.beginPath(); ctx.arc(cx+R*0.6,cy-R*0.62,R*0.09,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=`rgba(34,197,94,${0.2+0.15*Math.sin(t*0.08)})`;
    ctx.beginPath(); ctx.arc(cx+R*0.6,cy-R*0.62,R*0.15*(0.7+0.3*Math.sin(t*0.08)),0,Math.PI*2); ctx.fill();
  }

  ctx.restore();
}

function initStars(){
  stars=Array.from({length:140},()=>({
    x:Math.random(),y:Math.random(),r:Math.random()*0.9+0.1,
    a:Math.random()*0.3+0.03,tw:Math.random()*Math.PI*2,
    ts:0.0015+Math.random()*0.004,dx:(Math.random()-0.5)*0.00004,
  }));
}
initStars();
function drawStars(){
  for(const s of stars){
    s.x+=s.dx; s.tw+=s.ts;
    if(s.x<0)s.x=1; if(s.x>1)s.x=0;
    ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(210,222,255,${s.a*(0.5+0.5*Math.sin(s.tw))})`; ctx.fill();
  }
}

// ════════════════════════════════════════
// BUBBLE CLASS
// ════════════════════════════════════════
class Bubble{
  constructor({cx,cy,r,colorIdx,name,sub,data,delay,streamType}){
    this.targetX=cx; this.targetY=cy;
    this.x=W/2; this.y=H/2;
    this.r=r; this.color=COLORS[colorIdx%COLORS.length];
    this.name=name; this.sub=sub||''; this.data=data;
    this.alpha=0; this.scale=0.22; this.born=T+delay;
    this.hover=0; this.streamType=streamType||null;
    this.streamCanvas=null; this.streamCtx=null;
    // Subtle, slow breathe — just a hint of organic life
    this.harmonics=[
      {amp:r*0.028, freq:2, phase:Math.random()*Math.PI*2, speed:(0.00014+Math.random()*0.0001)*(Math.random()<0.5?1:-1)},
      {amp:r*0.018, freq:3, phase:Math.random()*Math.PI*2, speed:(0.0002+Math.random()*0.00012)*(Math.random()<0.5?1:-1)},
      {amp:r*0.010, freq:5, phase:Math.random()*Math.PI*2, speed:(0.0003+Math.random()*0.00015)*(Math.random()<0.5?1:-1)},
      {amp:r*0.006, freq:7, phase:Math.random()*Math.PI*2, speed:(0.00042+Math.random()*0.0002)*(Math.random()<0.5?1:-1)},
    ];
    this.iridPhase=Math.random()*Math.PI*2;
    this.iridSpeed=0.0003+Math.random()*0.0002;
    this.floatPhase=Math.random()*Math.PI*2;
    this.floatAmp=5+Math.random()*7;
    this.floatSpeedX=0.00025+Math.random()*0.00022;
    this.floatSpeedY=0.0002+Math.random()*0.0002;
    this.lastPts=[]; this.drawX=cx; this.drawY=cy;
    if(this.streamType){
      const s=Math.ceil(r*2);
      this.streamCanvas=document.createElement('canvas');
      this.streamCanvas.width=s; this.streamCanvas.height=s;
      this.streamCtx=this.streamCanvas.getContext('2d');
    }
  }
  get isReady(){ return T>=this.born; }
  update(){
    if(!this.isReady) return;
    this.x+=(this.targetX-this.x)*0.09;
    this.y+=(this.targetY-this.y)*0.09;
    this.alpha=Math.min(1,this.alpha+0.05);
    this.scale+=(1-this.scale)*0.07;
    if(this.streamCanvas&&this.streamType){
      const sc=this.streamCtx, s=this.streamCanvas.width;
      const renderer=STREAMS[this.streamType];
      if(renderer) renderer(sc,0,0,s,s,T);
    }
  }
  draw(mX,mY){
    if(!this.isReady||this.alpha<0.01) return;
    const fx=Math.sin(T*this.floatSpeedX+this.floatPhase)*this.floatAmp;
    const fy=Math.cos(T*this.floatSpeedY+this.floatPhase*1.4)*this.floatAmp*1.3;
    this.drawX=this.x+fx; this.drawY=this.y+fy;
    const pts=blobPoints(this.drawX,this.drawY,this.r*this.scale,this.harmonics,T);
    this.lastPts=pts;
    const isHovered=pointInBlob(mX,mY,pts);
    this.hover+=((isHovered?1:0)-this.hover)*0.1;
    ctx.save(); ctx.globalAlpha=this.alpha;
    // use morphing clip path for blob shape, but draw crystal sphere inside
    ctx.save();
    drawBlobPath(pts); ctx.clip();
    drawCrystalBubble(this.drawX,this.drawY,this.r*this.scale,this.color,T,this.hover,!!this.streamType,this.streamCanvas);
    ctx.restore();
    // ── Outer morphing rim — bright white ──
    drawBlobPath(pts);
    ctx.strokeStyle=`rgba(255,255,255,${0.38+this.hover*0.22})`; ctx.lineWidth=1.8; ctx.stroke();

    // ── Iridescent color rim — subtle prismatic whisper ──
    {
      const iT=T*this.iridSpeed+this.iridPhase;
      const rimPts=blobPoints(this.drawX,this.drawY,this.r*this.scale*1.0,this.harmonics,T);
      const n=rimPts.length;
      for(let i=0;i<n;i++){
        const p0=rimPts[i], p1=rimPts[(i+1)%n];
        const prog=i/n;
        const hue=(prog*360+iT*60)%360;
        const alpha=0.06+0.05*Math.sin(prog*Math.PI*4+iT*2);
        ctx.beginPath();
        ctx.moveTo((p0.x+p1.x)/2,(p0.y+p1.y)/2);
        ctx.lineTo(p1.x,p1.y);
        ctx.strokeStyle=`hsla(${hue},80%,80%,${alpha})`;
        ctx.lineWidth=1.2;
        ctx.stroke();
      }
    }

    // ── Inner morphing rim ──
    {const ip=blobPoints(this.drawX,this.drawY,this.r*this.scale*0.91,this.harmonics,T);
    drawBlobPath(ip); ctx.strokeStyle='rgba(255,255,255,0.07)'; ctx.lineWidth=0.8; ctx.stroke();}

    // ── Second inner glow ring — pulsing ──
    {const ip2=blobPoints(this.drawX,this.drawY,this.r*this.scale*0.97,this.harmonics,T);
    drawBlobPath(ip2);
    const [cr,cg,cb]=this.color;
    ctx.strokeStyle=`rgba(${cr},${cg},${cb},${0.12+0.08*Math.sin(T*0.012+this.floatPhase)})`;
    ctx.lineWidth=2.5; ctx.stroke();}

    // ── Hover outer glow ──
    if(this.hover>0.01){
      const op=blobPoints(this.drawX,this.drawY,this.r*this.scale*1.14,this.harmonics,T);
      drawBlobPath(op);
      const [cr,cg,cb]=this.color;
      ctx.strokeStyle=`rgba(${cr},${cg},${cb},${this.hover*0.55})`; ctx.lineWidth=3; ctx.stroke();
      drawBlobPath(op);
      ctx.strokeStyle=`rgba(255,255,255,${this.hover*0.18})`; ctx.lineWidth=1.5; ctx.stroke();
    }
    ctx.restore();
    // label
    ctx.save(); ctx.globalAlpha=this.alpha;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const ns=Math.max(9,this.r*this.scale*0.2);
    ctx.font=`600 ${ns}px -apple-system,SF Pro Display,sans-serif`;
    ctx.fillStyle='rgba(255,255,255,0.95)';
    ctx.shadowColor='rgba(0,0,0,0.9)'; ctx.shadowBlur=12;
    const ly=this.sub?this.drawY-ns*0.5:this.drawY;
    ctx.fillText(this.name,this.drawX,ly);
    if(this.sub){
      ctx.font=`400 ${Math.max(8,this.r*this.scale*0.14)}px -apple-system,sans-serif`;
      ctx.fillStyle='rgba(255,255,255,0.38)'; ctx.shadowBlur=4;
      ctx.fillText(this.sub,this.drawX,ly+ns*0.95);
    }
    ctx.restore();
  }
  hitTest(px,py){
    if(this.lastPts.length<3){const dx=px-this.drawX,dy=py-this.drawY;return Math.hypot(dx,dy)<this.r*1.2;}
    return pointInBlob(px,py,this.lastPts);
  }
}

// ════════════════════════════════════════
// SCENE
// ════════════════════════════════════════
function circular(n,cx,cy,rad){
  return Array.from({length:n},(_,i)=>{const a=(i/n)*Math.PI*2-Math.PI/2;return{x:cx+Math.cos(a)*rad,y:cy+Math.sin(a)*rad};});
}
function buildProjects(){
  bubbles=[];const cx=W/2,cy=H/2;const rad=Math.min(W,H)*0.27,r=Math.min(W,H)*0.105;
  const pos=circular(DATA.projects.length,cx,cy,rad);
  DATA.projects.forEach((p,i)=>bubbles.push(new Bubble({cx:pos[i].x,cy:pos[i].y,r,colorIdx:i,name:p.name,sub:p.sub,data:p,delay:i*8})));
}
function buildTeams(proj){
  bubbles=[];const cx=W/2,cy=H/2;const rad=Math.min(W,H)*0.24,r=Math.min(W,H)*0.09;
  const pos=circular(proj.teams.length,cx,cy,rad);
  proj.teams.forEach((t,i)=>bubbles.push(new Bubble({cx:pos[i].x,cy:pos[i].y,r,colorIdx:i+2,name:t.name,sub:t.sub,data:t,delay:i*8})));
}
function buildPeople(team){
  bubbles=[];const cx=W/2,cy=H/2;const n=team.people.length;
  const rad=Math.min(W,H)*(n<=3?0.2:0.23),r=Math.min(W,H)*0.09;
  const pos=circular(n,cx,cy,rad);
  team.people.forEach((p,i)=>bubbles.push(new Bubble({cx:pos[i].x,cy:pos[i].y,r,colorIdx:i+4,name:p.name,sub:'',data:p,delay:i*8,streamType:p.stream})));
}
function rebuildScene(){
  if(level===0)buildProjects();
  else if(level===1&&currentProject)buildTeams(currentProject);
  else if(level===2&&currentTeam)buildPeople(currentTeam);
}

// ════════════════════════════════════════
// CONNECTIONS
// ════════════════════════════════════════
function drawConnections(){
  if(bubbles.length<2)return;
  const cx=W/2,cy=H/2;
  for(const b of bubbles){
    if(b.alpha<0.05)continue;
    const g=ctx.createLinearGradient(cx,cy,b.drawX,b.drawY);
    g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(0.5,`rgba(255,255,255,${0.06*b.alpha})`);g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(b.drawX,b.drawY);ctx.strokeStyle=g;ctx.lineWidth=0.7;ctx.stroke();
  }
  for(let i=0;i<bubbles.length;i++)for(let j=i+1;j<bubbles.length;j++){
    const a=bubbles[i],b2=bubbles[j];if(a.alpha<0.1||b2.alpha<0.1)continue;
    const dist=Math.hypot(a.drawX-b2.drawX,a.drawY-b2.drawY);
    if(dist<300){ctx.beginPath();ctx.moveTo(a.drawX,a.drawY);ctx.lineTo(b2.drawX,b2.drawY);ctx.strokeStyle=`rgba(255,255,255,${(1-dist/300)*0.05})`;ctx.lineWidth=0.5;ctx.stroke();}
  }
}

function portalZoom(x,y,cb){
  const p=document.getElementById('portal');
  p.style.transformOrigin=`${x}px ${y}px`;
  p.style.background=`radial-gradient(circle at ${x}px ${y}px,rgba(255,255,255,0.25) 0%,transparent 45%)`;
  p.classList.remove('zooming','zooming-out');void p.offsetWidth;p.classList.add('zooming');
  transitioning=true;setTimeout(cb,380);setTimeout(()=>{p.classList.remove('zooming');transitioning=false;},800);
}
function portalZoomOut(cb){
  const p=document.getElementById('portal');
  p.classList.remove('zooming','zooming-out');void p.offsetWidth;p.classList.add('zooming-out');
  transitioning=true;setTimeout(cb,240);setTimeout(()=>{p.classList.remove('zooming-out');transitioning=false;},560);
}

// ════════════════════════════════════════
// PERSON PANEL
// ════════════════════════════════════════
let panelStreamT=0;
let panelStreamActive=false;
let panelStreamType=null;
let panelRafId=null;

function openPersonPanel(person){
  document.getElementById('person-name-sm').textContent=person.name;
  document.getElementById('person-role-sm').textContent=person.role;
  const av=document.getElementById('panel-avatar');
  av.textContent=person.name.charAt(0);
  av.style.background=`hsl(${person.name.charCodeAt(0)*15%360},60%,35%)`;
  document.getElementById('notes-list').innerHTML=person.notes.map(n=>
    `<div class="note-item"><div class="note-time">${n.time}</div><div class="note-text">${n.text}</div></div>`
  ).join('');
  document.getElementById('person-panel').classList.add('open');
  panelStreamType=person.stream;
  panelStreamActive=true;
  startPanelStream();
}
function closePanel(){
  document.getElementById('person-panel').classList.remove('open');
  panelStreamActive=false;
  if(panelRafId){cancelAnimationFrame(panelRafId);panelRafId=null;}
}
function startPanelStream(){
  const el=document.getElementById('stream-canvas-el');
  const container=document.getElementById('stream-container');
  el.width=container.clientWidth*(window.devicePixelRatio||1);
  el.height=container.clientHeight*(window.devicePixelRatio||1);
  el.style.width=container.clientWidth+'px';
  el.style.height=container.clientHeight+'px';
  const c=el.getContext('2d');
  c.scale(window.devicePixelRatio||1,window.devicePixelRatio||1);
  const W2=container.clientWidth, H2=container.clientHeight;
  function tick(){
    if(!panelStreamActive)return;
    c.clearRect(0,0,W2,H2);
    const renderer=STREAMS[panelStreamType];
    if(renderer)renderer(c,0,0,W2,H2,panelStreamT);
    panelStreamT+=0.6;
    panelRafId=requestAnimationFrame(tick);
  }
  tick();
}

// ════════════════════════════════════════
// INPUT
// ════════════════════════════════════════
canvas.addEventListener('mousemove',e=>{mouseX=e.clientX;mouseY=e.clientY;});
canvas.addEventListener('click',e=>handleTap(e.clientX,e.clientY));
canvas.addEventListener('touchend',e=>{e.preventDefault();const t=e.changedTouches[0];handleTap(t.clientX,t.clientY);},{passive:false});

function handleTap(px,py){
  if(transitioning)return;
  for(const b of bubbles){
    if(!b.hitTest(px,py))continue;
    if(level===0){currentProject=b.data;portalZoom(px,py,()=>{level=1;buildTeams(currentProject);updateUI();});}
    else if(level===1){currentTeam=b.data;portalZoom(px,py,()=>{level=2;buildPeople(currentTeam);updateUI();});}
    else if(level===2){openPersonPanel(b.data);}
    return;
  }
}
function goBack(){
  if(transitioning)return;
  if(level===1)portalZoomOut(()=>{level=0;buildProjects();updateUI();});
  else if(level===2)portalZoomOut(()=>{level=1;buildTeams(currentProject);updateUI();});
}
function navTo(t){
  if(transitioning)return;
  portalZoomOut(()=>{level=t;if(t===0){currentProject=null;currentTeam=null;buildProjects();}else if(t===1){currentTeam=null;buildTeams(currentProject);}updateUI();});
}
function updateUI(){
  const bc=document.getElementById('breadcrumb');
  let html=`<span class="${level===0?'active':''}" onclick="if(level>0)navTo(0)">Projects</span>`;
  if(level>=1&&currentProject)html+=`<span class="sep">›</span><span class="${level===1?'active':''}" onclick="if(level>1)navTo(1)">${currentProject.name}</span>`;
  if(level>=2&&currentTeam)html+=`<span class="sep">›</span><span class="active">${currentTeam.name}</span>`;
  bc.innerHTML=html;
  level>0?document.getElementById('back-btn').classList.add('show'):document.getElementById('back-btn').classList.remove('show');
  const hints=['Tap a bubble to zoom in','Tap a team to meet the people','Tap a person to open their workspace'];
  document.getElementById('hint').textContent=hints[level]||'';
}

// ════════════════════════════════════════
// BACKGROUND GRADIENT
// ════════════════════════════════════════
function drawBgGradient(){
  // Deep indigo bloom — top left
  const cx1=W*0.25+Math.sin(T*0.00015)*W*0.05;
  const cy1=H*0.28+Math.cos(T*0.00012)*H*0.04;
  const g1=ctx.createRadialGradient(cx1,cy1,0,cx1,cy1,Math.min(W,H)*0.8);
  g1.addColorStop(0,'rgba(55,60,160,0.28)');
  g1.addColorStop(1,'rgba(55,60,160,0)');
  ctx.fillStyle=g1; ctx.fillRect(0,0,W,H);

  // Midnight blue — bottom right
  const cx2=W*0.75+Math.sin(T*0.00011+1)*W*0.05;
  const cy2=H*0.72+Math.cos(T*0.00013+2)*H*0.04;
  const g2=ctx.createRadialGradient(cx2,cy2,0,cx2,cy2,Math.min(W,H)*0.7);
  g2.addColorStop(0,'rgba(30,50,140,0.22)');
  g2.addColorStop(1,'rgba(30,50,140,0)');
  ctx.fillStyle=g2; ctx.fillRect(0,0,W,H);

  // Soft violet center — barely there
  const cx3=W*0.5+Math.sin(T*0.00009+3)*W*0.04;
  const cy3=H*0.48+Math.cos(T*0.0001+1)*H*0.04;
  const g3=ctx.createRadialGradient(cx3,cy3,0,cx3,cy3,Math.min(W,H)*0.6);
  g3.addColorStop(0,'rgba(70,55,160,0.12)');
  g3.addColorStop(1,'rgba(70,55,160,0)');
  ctx.fillStyle=g3; ctx.fillRect(0,0,W,H);
}

// ════════════════════════════════════════
// LOOP
// ════════════════════════════════════════
function loop(){
  ctx.clearRect(0,0,W,H);
  // Dark blue-grey base
  ctx.fillStyle='#12131f';
  ctx.fillRect(0,0,W,H);
  drawBgGradient();
  drawStars();
  drawConnections();
  for(const b of bubbles){b.update();b.draw(mouseX,mouseY);}
  canvas.style.cursor=bubbles.some(b=>b.hitTest(mouseX,mouseY))?'pointer':'default';
  T+=0.6;
  requestAnimationFrame(loop);
}

buildProjects();updateUI();loop();
</script>

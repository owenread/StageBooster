<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="project-author" content="Owen Michael Read">
    <meta name="Description"
        content="Welcome to Project Atmos. Post your ambition and join others on life-changing projects!">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Exospheres | PeX</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="gradient-canvas">

    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">MaxQ <span class="brand-subtext">| Exosphere</span></a>

            <button class="hamburger-menu" id="hamburger-trigger" aria-label="Toggle Navigation">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>

            <nav id="nav-menu">
                <a href="index.html" class="nav-link active">Explore</a>
                <a href="#" class="nav-link">Dashboard</a>
                <a href="#" class="btn-primary">Launch Project</a>
            </nav>
        </div>
    </header>

    <section class="cinematic-hero">
        <div class="hero-phrase-gallery">
            <p class="story-phrase">Post your ambition.</p>
            <p class="story-phrase">Build next-generation engineering platforms.</p>
            <p class="story-phrase">Join others on life-changing project ventures.</p>
        </div>

        <div id="hero-cta-block" class="hero-cta-reveal">
            <h2>Welcome to Project Atmos</h2>
            <button class="btn-primary btn-launch-rocket">Explore Space</button>
        </div>
    </section>

    <div class="modal-overlay" id="collab-modal">
        <div class="modal-card">
            <button class="modal-close" id="close-modal-btn">✕</button>
            <h3>Send Collaboration Request</h3>
            <p>Describe what skills and vision you bring to this long-term venture.</p>
            <form id="modal-join-form">
                <label for="modal-apply-note" class="form-label">Why do you want to collaborate?</label>
                <textarea id="modal-apply-note" class="form-textarea"
                    placeholder="Describe your background and interests..." required></textarea>
                <button type="submit" class="btn-primary btn-block">Submit Application</button>
            </form>
        </div>
    </div>

    <main class="feed-container">
        <section class="control-panel">
            <div class="search-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input"
                    placeholder="Filter projects by title, stack, or target keywords..." autocomplete="off">
            </div>
            <div class="filter-pills" id="category-filters">
                <button class="pill-btn active" data-category="all">All Fields</button>
                <button class="pill-btn" data-category="Automotive">Automotive</button>
                <button class="pill-btn" data-category="Sports & Community">Sports & Community</button>
                <button class="pill-btn" data-category="Culinary & Events">Culinary & Events</button>
            </div>
        </section>

        <section class="project-grid" id="project-feed"></section>
    </main>

    <script src="js/app.js"></script>

</body>

</html>
